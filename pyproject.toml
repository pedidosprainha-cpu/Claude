[project]
name = "fxintel"
version = "1.0.0"
description = "Motor de inteligência de mercado para Forex e metais preciosos"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "httpx>=0.27",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fxintel*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning", "ignore::DeprecationWarning"]
