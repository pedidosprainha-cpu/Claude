<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e7a5f">
  <meta name="description" content="Painel da máquina de vendas como afiliado">
  <title>Máquina de Vendas</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icone-192.png">
  <link rel="apple-touch-icon" href="/static/icone-192.png">
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <div id="entrar" class="entrar" hidden>
    <div class="entrar-caixa">
      <img src="/static/icone-192.png" alt="" width="72" height="72">
      <h1>Máquina de Vendas</h1>
      <p class="suave">Digite o token do painel. Ele aparece quando o servidor é ligado e fica salvo no arquivo
        <code>dados/painel_token.txt</code>.</p>
      <form id="form-entrar">
        <label for="token">Token</label>
        <input id="token" type="password" autocomplete="current-password" required>
        <button class="botao primario" type="submit">Entrar</button>
        <p id="erro-entrar" class="erro"></p>
      </form>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topo">
      <div class="topo-linha">
        <div>
          <div class="topo-titulo">Máquina de Vendas</div>
          <div class="topo-sub" id="topo-sub"></div>
        </div>
        <span class="pilula" id="pilula-modo"></span>
      </div>
    </header>

    <main id="tela" tabindex="-1"></main>

    <nav class="abas" aria-label="Seções">
      <button data-aba="inicio" class="ativa"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
      <button data-aba="aprovar"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>Aprovar<span class="selo" id="selo-aprovar" hidden></span></button>
      <button data-aba="campanhas"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>Campanhas</button>
      <button data-aba="leads"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0"/></svg>Leads</button>
      <button data-aba="mais"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Mais</button>
    </nav>
  </div>

  <div id="aviso-rapido" class="aviso-rapido" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
