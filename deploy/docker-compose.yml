services:
  fxintel:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      - FXI_DATA_DIR=/data
      # - FXI_API_KEY=troque-por-uma-chave-longa-e-aleatoria
      # - FXI_OANDA_TOKEN=...        # bid/ask reais (conta practice ou live)
      # - FXI_OANDA_ACCOUNT=...
      # - FXI_OANDA_ENV=practice
      # - FXI_LIVE_TRADING=0         # 1 habilita envio real de ordens (requer confirmação por ordem)
    volumes:
      - fxintel-data:/data
    ports:
      - "8000:8000"
  caddy:   # HTTPS automático (Let's Encrypt). Ajuste o domínio no Caddyfile.
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [fxintel]
    profiles: ["https"]
volumes:
  fxintel-data:
  caddy-data:
